[workspace]
members = ["crates/initiald-core", "crates/initiald-launcher"]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/akitaonrails/rea-teknoparrot-initial-d-series"

[workspace.dependencies]
# The shared launcher SDK, pinned to a release tag (rea-launcher-sdk docs/playbooks/sdk-change.md).
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.12.2" }
rea-launcher-native = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.12.2", default-features = false, features = ["feeder"] }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.12.2" }
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.12.2" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
