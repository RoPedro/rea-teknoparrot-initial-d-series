[workspace]
members = ["crates/initiald-core", "crates/initiald-launcher"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/akitaonrails/rea-teknoparrot-initial-d-series"

[workspace.dependencies]
# The shared launcher SDK, pinned to a release tag (rea-launcher-sdk docs/playbooks/sdk-change.md).
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
rea-launcher-native = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0", default-features = false, features = ["feeder"] }
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

# Until rea-launcher-sdk v0.10.0 is tagged: the SDK's feat/hub branch, checked out beside this repository.
[patch."https://github.com/akitaonrails/rea-launcher-sdk"]
rea-launcher = { path = "../rea-launcher-sdk-hub/crates/rea-launcher" }
rea-launcher-native = { path = "../rea-launcher-sdk-hub/crates/rea-launcher-native" }
rea-launcher-ui = { path = "../rea-launcher-sdk-hub/crates/rea-launcher-ui" }
rea-launcher-win32 = { path = "../rea-launcher-sdk-hub/crates/rea-launcher-win32" }
